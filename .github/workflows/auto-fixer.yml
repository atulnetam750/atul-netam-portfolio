name: Auto Update, Sync & Auto Fixer

on:
  schedule:
    # Automatically fetches IBC24 Narayanpur news & YouTube Analytics every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: write

concurrency:
  group: portfolio-auto-sync
  cancel-in-progress: false

jobs:
  auto-update-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile automation script
        run: python3 -c "from pathlib import Path; compile(Path('.github/scripts/auto_sync.py').read_text(encoding='utf-8'), '.github/scripts/auto_sync.py', 'exec')"

      - name: Run IBC24 & YouTube Live Auto-Sync
        run: python3 .github/scripts/auto_sync.py

      - name: Auto Fixer & Integrity Check
        run: |
          echo "Running Auto-Fixer checks..."
          if [ ! -f index.html ] || [ ! -f data/live-feed.json ]; then
            echo "Required files missing!"
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/live-feed.json").read_text(encoding="utf-8"))
          videos = data.get("videos", [])
          assert isinstance(videos, list) and len(videos) == 22, "Expected 22 video records"
          assert len({v.get("id") for v in videos}) == len(videos), "Duplicate video IDs"
          assert all(isinstance(v.get("title"), str) and v.get("id") for v in videos), "Invalid video record"
          news = data.get("ibc24_narayanpur", [])
          assert isinstance(news, list), "News feed must be a list"
          print(f"Validated feed: {len(videos)} videos, {len(news)} news items")
          PY
          # Ensure no banned old phone number exists
          if grep -q "9406175560" index.html; then
            sed -i 's/+91 9406175560//g; s/9406175560//g' index.html
          fi

      - name: Auto Commit Updated Feed & Fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-sync IBC24 Narayanpur news & YouTube analytics [skip ci]"
          branch: master
