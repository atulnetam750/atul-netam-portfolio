name: Auto Update, Sync & Auto Fixer

on:
  schedule:
    # Automatically fetches IBC24 Narayanpur news & YouTube Analytics every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  auto-update-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run IBC24 & YouTube Live Auto-Sync
        run: |
          python3 .github/scripts/auto_sync.py

      - name: Auto Fixer & Integrity Check
        run: |
          echo "Running Auto-Fixer checks..."
          if [ ! -f index.html ] || [ ! -f data/live-feed.json ]; then
            echo "Required files missing!"
            exit 1
          fi
          python3 -c "import json; d=json.load(open('data/live-feed.json')); print('Validated JSON:', len(d.get('videos',[])), 'videos,', len(d.get('ibc24_narayanpur',[])), 'news')"
          # Ensure no banned old phone number exists
          if grep -q "9406175560" index.html; then
            sed -i 's/+91 9406175560//g; s/9406175560//g' index.html
          fi

      - name: Auto Commit Updated Feed & Fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-sync IBC24 Narayanpur news & YouTube analytics [skip ci]"
          branch: master
